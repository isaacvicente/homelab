---
- name: Create minio system user
  become: true
  ansible.builtin.user:
    name: minio-user
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Create MinIO data directory
  become: true
  ansible.builtin.file:
    path: /var/lib/minio
    state: directory
    owner: minio-user
    group: minio-user
    mode: '0750'

- name: Install MinIO server (.deb package)
  become: true
  ansible.builtin.apt:
    deb: "https://dl.min.io/server/minio/release/linux-amd64/archive/minio_{{ minio_version }}_amd64.deb"
    state: present

- name: Download MinIO client (mc)
  become: true
  ansible.builtin.get_url:
    url: "https://dl.min.io/client/mc/release/linux-amd64/mc"
    dest: /usr/local/bin/mc
    mode: '0755'
    owner: root
    group: root

- name: Deploy MinIO environment file (credentials from vault)
  become: true
  ansible.builtin.template:
    src: minio.env.j2
    dest: /etc/default/minio
    mode: '0640'
    owner: root
    group: minio-user
  notify:
    - Reload systemd
    - Restart minio

- name: Deploy MinIO systemd service unit
  become: true
  ansible.builtin.template:
    src: minio.service.j2
    dest: /etc/systemd/system/minio.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart minio

- name: Enable and start MinIO service
  become: true
  ansible.builtin.systemd:
    name: minio
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for MinIO API to be ready
  ansible.builtin.wait_for:
    host: localhost
    port: 9000
    timeout: 30

- name: Configure mc alias for local MinIO
  ansible.builtin.command:
    cmd: mc alias set local http://localhost:9000 {{ minio_root_user }} {{ minio_root_password }}
  changed_when: false

- name: Create tfstate bucket
  ansible.builtin.command:
    cmd: mc mb --ignore-existing local/tfstate
  register: mb_result
  changed_when: "'Bucket created' in mb_result.stdout"
