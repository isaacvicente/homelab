---
# Configures a Linux bridge (br0) on the host using netplan.
# After this task runs, the host is reachable at {{ incus_bridge_ip }}.
# Incus VMs attached to br0 receive IPs from the home router's DHCP server.

# Prevent cloud-init from regenerating 50-cloud-init.yaml on future reboots.
- name: Disable cloud-init network configuration
  become: true
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: |
      # Managed by Ansible — disables cloud-init network reconfiguration.
      network: {config: disabled}
    mode: '0644'

# Remove the cloud-init managed netplan file to avoid conflicting bridge definitions.
- name: Remove cloud-init managed netplan file
  become: true
  ansible.builtin.file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent
  notify: Apply netplan

- name: Deploy bridge netplan configuration
  become: true
  ansible.builtin.template:
    src: bridge.yaml.j2
    dest: /etc/netplan/60-incus-bridge.yaml
    mode: '0600'
  notify: Apply netplan

- name: Find existing netplan config files
  ansible.builtin.find:
    paths: /etc/netplan
    patterns: "*.yaml,*.yml"
    excludes: "60-incus-bridge.yaml"
  register: netplan_files

# The physical interface must not have its own DHCP lease once it becomes a bridge port.
- name: Disable DHCP on physical interface in existing netplan configs
  become: true
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '(\s+dhcp4:\s+true)'
    replace: '\1  # Disabled — DHCP moved to {{ incus_bridge_name }} (see 60-incus-bridge.yaml)'
  loop: "{{ netplan_files.files }}"
  notify: Apply netplan
