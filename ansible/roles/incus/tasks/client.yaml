- name: Generate client certificate on localhost
  delegate_to: localhost
  run_once: true
  block:
    - name: Generate private key
      community.crypto.openssl_privatekey:
        path: "{{ incus_client_config_path }}/client.key"
        type: "Ed25519"
        mode: '0600'

    - name: Generate self-signed certificate
      community.crypto.x509_certificate:
        path: "{{ incus_client_config_path }}/client.crt"
        privatekey_path: "{{ incus_client_config_path }}/client.key"
        provider: selfsigned
        selfsigned_not_after: "+3650d"
        mode: '0644'

- name: Copy certificate to server
  ansible.builtin.copy:
    src: "{{ incus_client_config_path }}/client.crt"
    dest: "{{ incus_server_cert_path }}"
    mode: '0644'

- name: Check if certificate already exists in trust store
  ansible.builtin.shell: |
    set -o pipefail
    fingerprint=$(openssl x509 -in {{ incus_server_cert_path }} -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-Z' 'a-z' | cut -c1-"12")
    incus config trust list --columns f --format csv | grep -q "$fingerprint" && echo "exists" || echo "missing"
  args:
    executable: /usr/bin/bash
  register: cert_check
  changed_when: false

- name: Add certificate to Incus trust store
  become: true
  ansible.builtin.command:
    cmd: incus config trust add-certificate {{ incus_server_cert_path }}
  when: cert_check.stdout == "missing"
  register: add_result
  changed_when: add_result.rc == 0

- name: Clean up certificate file from server
  ansible.builtin.file:
    path: "{{ incus_server_cert_path }}"
    state: absent

- name: Add Incus remote on localhost
  delegate_to: localhost
  run_once: true
  block:
    - name: Check if remote already exists
      ansible.builtin.command:
        cmd: incus remote list --format csv
      register: remote_list
      changed_when: false

    - name: Add remote | {{ incus_remote_name }}
      ansible.builtin.command:
        cmd: >
          incus remote add {{ incus_remote_name }}
          https://{{ ansible_facts['default_ipv4']['address'] }}:8443
          --accept-certificate
      when: "incus_remote_name not in remote_list.stdout"
      register: remote_add
      changed_when: remote_add.rc == 0
