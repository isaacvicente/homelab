# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
clusterName: homelab
talosVersion: v1.13.9
kubernetesVersion: v1.36.0
endpoint: https://192.168.18.100:6443

nodes:
  - hostname: homelab
    ipAddress: 192.168.18.100
    controlPlane: true
    installDisk: /dev/disk/by-id/ata-KINGSTON_SA400S37480G_50026B7785269E28
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/intel-ucode
            - siderolabs/i915
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
            - siderolabs/tailscale
    extensionServices:
      - name: tailscale
        environment:
          - TS_AUTHKEY=${tailscale_auth_key}
          - TS_EXTRA_ARGS=--advertise-tags=tag:k8s-operator
    networkInterfaces:
      - interface: enp0s31f6
        addresses:
          - 192.168.18.100/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.18.1
        dhcp: false
    nameservers:
      - 8.8.8.8
      - 1.1.1.1

controlPlane:
  patches:
    - |-
      cluster:
        allowSchedulingOnControlPlanes: true
      machine:
        kubelet:
          extraMounts:
            - destination: /var/lib/longhorn
              type: bind
              source: /var/lib/longhorn
              options:
                - bind
                - rshared
                - rw

