machine:
  network:
    hostname: homelab
    interfaces:
      - interface: enp0s31f6
        addresses:
          - 192.168.18.100/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.18.1
        dhcp: false
    nameservers:
      - 8.8.8.8
      - 1.1.1.1

cluster:
  # Allow workloads to be scheduled on the single control plane node
  allowSchedulingOnControlPlanes: true
