version: '3'

vars:
  TALOS_DIR: talos
  NODE_IP: 192.168.18.100

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  lint:
    desc: Run local validation (Talos config + Kustomize builds)
    cmds:
      - talhelper validate talconfig talos/talconfig.yaml --no-substitute
      - kubectl kustomize kubernetes > /dev/null
      - echo "All local validations passed successfully!"

  age-key:
    desc: Generate age encryption key if none exists (~/.config/sops/age/keys.txt)
    cmds:
      - mkdir -p ~/.config/sops/age
      - |
        if [ ! -f ~/.config/sops/age/keys.txt ]; then
          age-keygen -o ~/.config/sops/age/keys.txt
          echo "New age key generated at ~/.config/sops/age/keys.txt"
        else
          echo "Existing age key found at ~/.config/sops/age/keys.txt"
        fi
      - echo ""
      - echo "Your age Public Key (paste this into .sops.yaml):"
      - age-keygen -y ~/.config/sops/age/keys.txt

  secrets:
    desc: Generate cluster secrets and encrypt with SOPS
    cmds:
      - mkdir -p {{.TALOS_DIR}}
      - |
        if [ ! -f {{.TALOS_DIR}}/talsecret.sops.yaml ]; then
          echo "Generating {{.TALOS_DIR}}/talsecret.sops.yaml via talhelper..."
          talhelper gensecret > {{.TALOS_DIR}}/talsecret.sops.yaml
          sops -e -i {{.TALOS_DIR}}/talsecret.sops.yaml
          echo "Secrets generated and encrypted."
        else
          echo "{{.TALOS_DIR}}/talsecret.sops.yaml already exists."
        fi

  generate:
    desc: Generate Talos machine configs from talconfig.yaml + talsecret.sops.yaml
    sources:
      - '{{.TALOS_DIR}}/talconfig.yaml'
      - '{{.TALOS_DIR}}/talsecret.sops.yaml'
      - '{{.TALOS_DIR}}/talenv.sops.yaml'
    generates:
      - '{{.TALOS_DIR}}/clusterconfig/talosconfig'
      - '{{.TALOS_DIR}}/clusterconfig/homelab-homelab.yaml'
    cmds:
      - |
        TALENV_OPT=""
        if [ -f {{.TALOS_DIR}}/talenv.sops.yaml ]; then
          TALENV_OPT="-e {{.TALOS_DIR}}/talenv.sops.yaml"
        fi
        talhelper genconfig \
          -c {{.TALOS_DIR}}/talconfig.yaml \
          -s {{.TALOS_DIR}}/talsecret.sops.yaml \
          $TALENV_OPT \
          -o {{.TALOS_DIR}}/clusterconfig
      - echo "Generated machine configs in {{.TALOS_DIR}}/clusterconfig/"

  apply:
    desc: Apply generated config to baremetal node in maintenance mode (installs to disk)
    cmds:
      - talosctl apply-config --insecure --nodes {{.NODE_IP}} --file {{.TALOS_DIR}}/clusterconfig/homelab-homelab.yaml

  upgrade:
    desc: Upgrade Talos OS on running node with generated installer image
    deps: [generate]
    cmds:
      - |
        IMAGE=$(grep "image: factory.talos.dev" {{.TALOS_DIR}}/clusterconfig/homelab-homelab.yaml | awk '{print $2}')
        if [ -z "$IMAGE" ]; then
          echo "Error: Installer image not found in {{.TALOS_DIR}}/clusterconfig/homelab-homelab.yaml. Run 'task generate' first."
          exit 1
        fi
        echo "1. Applying updated machine configuration..."
        talosctl apply-config \
          --talosconfig {{.TALOS_DIR}}/clusterconfig/talosconfig \
          --nodes {{.NODE_IP}} \
          --file {{.TALOS_DIR}}/clusterconfig/homelab-homelab.yaml
        echo ""
        echo "2. Upgrading Talos OS to: $IMAGE ..."
        talosctl upgrade \
          --talosconfig {{.TALOS_DIR}}/clusterconfig/talosconfig \
          --nodes {{.NODE_IP}} \
          --image $IMAGE

  bootstrap:
    desc: Bootstrap etcd on the baremetal node
    cmds:
      - talosctl bootstrap --talosconfig {{.TALOS_DIR}}/clusterconfig/talosconfig --nodes {{.NODE_IP}}

  kubeconfig:
    desc: Fetch and merge admin kubeconfig to ~/.kube/homelab.yaml
    cmds:
      - mkdir -p ~/.kube
      - talosctl kubeconfig ~/.kube/homelab.yaml --talosconfig {{.TALOS_DIR}}/clusterconfig/talosconfig --nodes {{.NODE_IP}} --merge
      - chmod 600 ~/.kube/homelab.yaml
      - echo "Cluster ready. export KUBECONFIG=~/.kube/homelab.yaml"

  sops-secret:
    desc: Create sops-age decryption secret in flux-system from local age key
    cmds:
      - |
        if [ ! -f ~/.config/sops/age/keys.txt ]; then
          echo "Error: ~/.config/sops/age/keys.txt not found. Run 'task age-key' first."
          exit 1
        fi
        kubectl create secret generic sops-age \
          --namespace=flux-system \
          --from-file=age.agekey=$HOME/.config/sops/age/keys.txt \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "sops-age secret successfully configured in flux-system namespace."

  flux-init:
    desc: Bootstrap Flux CD into the cluster from this Git repository
    cmds:
      - |
        if [ -z "$GITHUB_TOKEN" ]; then
          echo "Error: GITHUB_TOKEN is not set. Export: export GITHUB_TOKEN=ghp_..."
          exit 1
        fi
        flux bootstrap github \
          --owner=isaacvicente \
          --repository=homelab \
          --branch=main \
          --path=kubernetes \
          --personal

  reset:
    desc: Factory reset the physical node (DESTRUCTIVE — wipes disk)
    cmds:
      - talosctl reset --talosconfig {{.TALOS_DIR}}/clusterconfig/talosconfig --nodes {{.NODE_IP}} --graceful=false --reboot
